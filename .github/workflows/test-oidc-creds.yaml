          aws-region: us-east-1

      - name: Check caller identity (workspaces)
        run: |
          echo "=== WORKSPACES Environment ===" 
          aws sts get-caller-identity

  test-ad:
    name: Test Ad Environment
    runs-on: ubuntu-latest
    environment: ad
    
    steps:
      - name: Configure AWS credentials (ad)
        uses: aws-actions/configure-aws-credentials@v6.2.3
