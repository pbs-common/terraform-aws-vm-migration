name: Prod Environment

on:
  workflow_dispatch:

  # The two path lists below are identical and must stay that way. GitHub Actions does
  # not support YAML anchors, so there is no way to write it once. Both are checked:
  # check_terraform_ci_coverage.py reads `push` as well as `pull_request` (CHANGE_TRIGGERS)
  # and fails when a filter stops matching anything on disk.
  push:
    branches:
      - main
    # Without this, every commit landing on main -- a README edit, a scripts/ change --
    # would plan and APPLY against the Prod account, because plan-prod is no longer gated off
    # for push. A merge should only reach AWS when it touched something that changes the
    # plan.
    paths:
      # Every module environments/prod consumes must appear here, or editing that module
      # changes this plan and triggers nothing.
      # .github/scripts/check_terraform_ci_coverage.py check 3 now derives this list
      # from the environment's own `source = "../../modules/..."` lines and fails if
      # one is absent.
      - "environments/prod/**"
      - "modules/backup/**"
      - "modules/cloudwatch-alerts/**"
      - "modules/instance-alarms/**"
      # Shared inputs that change what this pipeline DOES. Without them a PR editing the
      # lint config or the reusable workflow runs no plan and no tflint, so the change to
      # the checking itself is never exercised by the thing it checks.
      - ".tflint.hcl"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    # Identical to push.paths above, where the reasoning for each entry is recorded.
    # Edit both or neither.
    paths:
      - "environments/prod/**"
      - "modules/backup/**"
      - "modules/cloudwatch-alerts/**"
      - "modules/instance-alarms/**"
      - ".tflint.hcl"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A merge to main reaches `terraform apply` once approved, so two merges in quick succession
# can race the same state. cancel-in-progress is false deliberately: cancelling a run
# mid-apply strands the S3 native lock (use_lockfile = true) next to the state object, which
# someone then has to clear by hand. Queueing is the cheaper failure.
concurrency:
  group: terraform-prod-${{ github.ref }}
  cancel-in-progress: false


jobs:
  # Step 1: Validate Terraform format
  validate-prod:
    name: Validate Format
    uses: pbs-common/terraform-aws-shared-ghpipeline/.github/workflows/terraform-validate.yaml@6508cefe56f5aaefac031c1382dad73c1d698b2c
    with:
      terraform_version: "1.16.0"
      working_directory: environments/prod
      runs_on: ubuntu-latest

  # Step 2: Build and upload the webhook forwarder Lambda's deployment package to S3,
  # independent of terraform plan/apply. Plan and apply run as separate jobs on separate
  # runners, so a zip built locally during plan (the old approach, a local archive_file)
  # never exists when apply's fresh checkout runs -- confirmed broken this way on
  # 2026-10-09 (ad/staging/prod all partially applied, Lambda creation failed). Uploading
  # here means plan and apply only ever reference an S3 key, never a local file. Reuses
  # this account's own state bucket - the OIDC role already has full access to it.
  # `environment: prod` is required here, same as plan/apply - OIDC_ROLE_ARN is an
  # environment-scoped secret, invisible to a job that doesn't declare it. Confirmed by
  # the first version of this job failing with an empty role-to-assume.
  build-webhook-forwarder-prod:
    name: Build Webhook Forwarder Lambda
    needs: validate-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Zip and upload to S3
        working-directory: modules/cloudwatch-alerts/lambda
        run: |
          zip webhook_forwarder.zip webhook_forwarder.py
          aws s3 cp webhook_forwarder.zip s3://pbs-prod-terraform-state/cloudwatch-alerts/webhook_forwarder.zip

  # Step 3: Plan Terraform changes. Unconditional on purpose -- it runs for every trigger
  # this workflow declares. The tfplan artifact it uploads is what apply-prod consumes.
  plan-prod:
    name: Plan Prod Environment
    needs: validate-prod
    uses: pbs-common/terraform-aws-shared-ghpipeline/.github/workflows/terraform-plan.yaml@6508cefe56f5aaefac031c1382dad73c1d698b2c
    with:
      terraform_version: "1.16.0"
      tflint_version: "0.64.0"
      aws_region: us-east-1
      working_directory: environments/prod
      environment: prod
      s3_backend_bucket: pbs-prod-terraform-state
      s3_backend_key: prod/terraform.tfstate
      post_pr_comment: true
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}

  # Step 4: Apply the plan artifact produced by plan-prod in THIS run. Merge to main, or a
  # manual dispatch from main. Reaching this job does not apply anything:
  # terraform-apply.yaml declares `environment: prod`, whose required reviewers hold it at
  # "Waiting" until someone approves. Pull requests never reach it -- on a PR the ref is
  # refs/pull/<n>/merge, never refs/heads/main. Needs build-webhook-forwarder-prod too, so
  # the Lambda zip is already in S3 by the time this actually applies.
  apply-prod:
    name: Apply Prod Environment
    needs: [plan-prod, build-webhook-forwarder-prod]
    uses: pbs-common/terraform-aws-shared-ghpipeline/.github/workflows/terraform-apply.yaml@6508cefe56f5aaefac031c1382dad73c1d698b2c
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    with:
      terraform_version: "1.16.0"
      aws_region: us-east-1
      working_directory: environments/prod
      environment: prod
      s3_backend_bucket: pbs-prod-terraform-state
      s3_backend_key: prod/terraform.tfstate
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}
