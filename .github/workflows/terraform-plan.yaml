name: Terraform Plan (Reusable)

on:
  workflow_call:
    inputs:
      terraform_version:
        type: string
        default: "1.16.0"
        
      tflint_version:
        type: string
        default: "0.45.0"

      aws_region:
      
        type: string
        required: true

      working_directory:
        type: string
        required: true

      environment:
        type: string
        required: true

      post_pr_comment:
        type: boolean
        default: true

      runs_on:
        type: string
        default: ubuntu-latest

      s3_backend_bucket:
        type: string
        required: true

      s3_backend_key:
        type: string
        required: true

      retention_days:
        type: number
        default: 7

    secrets:
      OIDC_ROLE_ARN:
        required: true
      TF_VAR_EXTRAS:
        required: false

    outputs:
      plan_exitcode:
        value: ${{ jobs.plan.outputs.exitcode }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflintv6.2.3
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: Run TFLint
        run: |
          tflint --init
          tflint --format compact

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.s3_backend_bucket }}" \
            -backend-config="key=${{ inputs.s3_backend_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -input=false

      # --------------------
      # Inject TF vars from map
      # --------------------
      - name: Export TF_VAR_EXTRAS to env
        run: |
          if [ -n "${TF_VAR_EXTRAS}" ]; then
            echo "$TF_VAR_EXTRAS" | jq -r 'to_entries|map("TF_VAR_\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
          fi
        env:
          TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            --var-file ${{ inputs.environment }}.tfvars \
            -no-color \
            -input=false \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Show Terraform Plan
        if: always()
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_output.txt
          else
            echo "No plan file found - terraform plan may have failed with errors" > plan_output.txt
          fi

      - name: Post Plan to PR
        if: inputs.post_pr_comment && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const output = `#### Terraform Plan (\`${process.env.ENV_NAME}\`)

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Terraform Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: ${{ inputs.retention_days }}

      - name: Fail on Plan Error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
