name: AD Environment Plan

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    paths:
      # Every module environments/ad consumes must appear here, or editing that module
      # changes this plan and triggers nothing. ssm-session-access-policy was missing
      # until 2026-09-11 despite being consumed since environments/ad/main.tf:191.
      # .github/scripts/check_terraform_ci_coverage.py check 3 now derives this list
      # from the environment's own `source = "../../modules/..."` lines and fails if
      # one is absent.
      - "environments/ad/**"
      - "modules/ec2-windows-workload/**"
      - "modules/mgn-replication-baseline/**"
      - "modules/ssm-session-access-policy/**"
      # Shared inputs that change what this pipeline DOES. Without them a PR editing the
      # lint config or the reusable workflow runs no plan and no tflint, so the change to
      # the checking itself is never exercised by the thing it checks.
      - ".tflint.hcl"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write


jobs:
  # Step 1: Validate Terraform format
  validate-ad:
    name: Validate Format
    uses: ./.github/workflows/terraform-validate.yaml
    with:
      terraform_version: "1.16.0"
      working_directory: environments/ad
      runs_on: ubuntu-latest

  # Step 2: Plan Terraform changes.
  plan-ad:
    name: Plan AD Environment
    needs: validate-ad
    uses: ./.github/workflows/terraform-plan.yaml
    # Only apply on main branch (not on PRs)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    with:
      terraform_version: "1.16.0"
      tflint_version: "0.64.0"
      aws_region: us-east-1
      working_directory: environments/ad
      environment: ad
      s3_backend_bucket: pbs-ad-ds-terraform-state
      s3_backend_key: ad/terraform.tfstate
      post_pr_comment: true
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}

  # Step 3: Apply the plan artifact produced by plan-ad, main branch only.
  apply-ad:
    name: Apply AD Environment
    needs: plan-ad
    uses: ./.github/workflows/terraform-apply.yaml
    # Only apply on main branch (not on PRs)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    with:
      terraform_version: "1.16.0"
      aws_region: us-east-1
      working_directory: environments/ad
      environment: ad
      s3_backend_bucket: pbs-ad-ds-terraform-state
      s3_backend_key: ad/terraform.tfstate
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}
