name: Workspaces Environment

on:
  workflow_dispatch:

  # The two path lists below are identical and must stay that way. GitHub Actions does
  # not support YAML anchors, so there is no way to write it once. Both are checked:
  # check_terraform_ci_coverage.py reads `push` as well as `pull_request` (CHANGE_TRIGGERS)
  # and fails when a filter stops matching anything on disk.
  push:
    branches:
      - main
    # Without this, every commit landing on main -- a README edit, a scripts/ change --
    # would plan and APPLY against the Workspaces account, because plan-workspaces is no longer gated off
    # for push. A merge should only reach AWS when it touched something that changes the
    # plan.
    paths:
      # Every module environments/workspaces consumes must appear here, or editing that module
      # changes this plan and triggers nothing.
      # .github/scripts/check_terraform_ci_coverage.py check 3 now derives this list
      # from the environment's own `source = "../../modules/..."` lines and fails if
      # one is absent.
      - "environments/workspaces/**"
      - "modules/backup/**"
      # Shared inputs that change what this pipeline DOES. Without them a PR editing the
      # lint config or the reusable workflow runs no plan and no tflint, so the change to
      # the checking itself is never exercised by the thing it checks.
      - ".tflint.hcl"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    # Identical to push.paths above, where the reasoning for each entry is recorded.
    # Edit both or neither.
    paths:
      - "environments/workspaces/**"
      - "modules/backup/**"
      - ".tflint.hcl"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A merge to main reaches `terraform apply` once approved, so two merges in quick succession
# can race the same state. cancel-in-progress is false deliberately: cancelling a run
# mid-apply strands the S3 native lock (use_lockfile = true) next to the state object, which
# someone then has to clear by hand. Queueing is the cheaper failure.
concurrency:
  group: terraform-workspaces-${{ github.ref }}
  cancel-in-progress: false


jobs:
  # Step 1: Validate Terraform format
  validate-workspaces:
    name: Validate Format
    uses: ./.github/workflows/terraform-validate.yaml
    with:
      terraform_version: "1.16.0"
      working_directory: environments/workspaces
      runs_on: ubuntu-latest

  # Step 2: Plan Terraform changes. Unconditional on purpose -- it runs for every trigger
  # this workflow declares. The tfplan artifact it uploads is what apply-workspaces consumes.
  plan-workspaces:
    name: Plan Workspaces Environment
    needs: validate-workspaces
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      terraform_version: "1.16.0"
      tflint_version: "0.64.0"
      aws_region: us-east-1
      working_directory: environments/workspaces
      environment: workspaces
      s3_backend_bucket: pbs-workspaces-terraform-state
      s3_backend_key: workspaces/terraform.tfstate
      post_pr_comment: true
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}

  # Step 3: Apply the plan artifact produced by plan-workspaces in THIS run. Merge to main, or a
  # manual dispatch from main. Reaching this job does not apply anything:
  # terraform-apply.yaml declares `environment: workspaces`, whose required reviewers hold it at
  # "Waiting" until someone approves. Pull requests never reach it -- on a PR the ref is
  # refs/pull/<n>/merge, never refs/heads/main.
  apply-workspaces:
    name: Apply Workspaces Environment
    needs: plan-workspaces
    uses: ./.github/workflows/terraform-apply.yaml
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    with:
      terraform_version: "1.16.0"
      aws_region: us-east-1
      working_directory: environments/workspaces
      environment: workspaces
      s3_backend_bucket: pbs-workspaces-terraform-state
      s3_backend_key: workspaces/terraform.tfstate
      runs_on: ubuntu-latest
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}
