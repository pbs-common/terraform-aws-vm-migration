name: Example Deploy Workflow (Using Reusable Workflows)

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - '.github/workflows/example-deploy.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'

jobs:
  # Step 1: Plan Terraform changes (AD environment only)
  plan-ad:
    name: Plan AD Environment
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      terraform_version: "1.16.0"
      tflint_version: "0.64.0"
      aws_region: us-east-1
      working_directory: environments/ad
      environment: ad
      s3_backend_bucket: pbs-ad-ds-terraform-state
      s3_backend_key: ad/terraform.tfstate
      post_pr_comment: true
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}

  # Step 2: Apply the plan (only on main branch after approval)
  #         Requires plan artifact from plan-ad job
  apply-ad:
    name: Apply AD Environment
    needs: plan-ad
    uses: ./.github/workflows/terraform-apply.yaml
    # Only apply on main branch (not on PRs)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    with:
      terraform_version: "1.16.0"
      aws_region: us-east-1
      working_directory: environments/ad
      environment: ad
      s3_backend_bucket: pbs-ad-ds-terraform-state
      s3_backend_key: ad/terraform.tfstate
    secrets:
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN }}
      TF_VAR_EXTRAS: ${{ secrets.TF_VAR_EXTRAS }}
